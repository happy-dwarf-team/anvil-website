name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by happy-dwarf-team/anvil after a release, so the download button shows the new version.
  repository_dispatch:
    types: [anvil-release]
  # Safety net in case a dispatch is missed.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Repository variable CUSTOM_DOMAIN (e.g. anvil.happydwarf.dev) switches from the
      # github.io project URL to the custom domain.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || 'https://happy-dwarf-team.github.io' }}
          SITE_BASE: ${{ vars.CUSTOM_DOMAIN && '/' || '/anvil-website' }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
