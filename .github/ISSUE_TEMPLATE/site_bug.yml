name: Site bug
description: A page that does not load, looks broken, or does not work with the keyboard or a screen reader.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g. Firefox 140 on Windows 11, Safari on iPhone, NVDA with Chrome.
    validations:
      required: true
